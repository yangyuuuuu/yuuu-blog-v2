# ==========================================================================
#  Sveltia CMS 配置（格式与 Decap / Netlify CMS 兼容）
#  repo / base_url / site_url 三处已按真实站点填好，换域名时记得一起改。
# ==========================================================================

backend:
  name: github
  repo: yangyuuuuu/yuuu-blog-v2
  branch: main
  # OAuth Worker（见 workers/oauth），已部署在 oauth.yuuu.love
  base_url: https://oauth.yuuu.love
  commit_messages:
    create: "post: 新建《{{slug}}》"
    update: "post: 更新《{{slug}}》"
    delete: "post: 删除《{{slug}}》"
    uploadMedia: "media: 上传 {{path}}"
    deleteMedia: "media: 删除 {{path}}"

site_url: https://yuuu.love
display_url: https://yuuu.love
logo_url: https://yuuu.love/icon-192.png

locale: zh_Hans
publish_mode: simple

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: posts
    label: 文章
    label_singular: 一篇文章
    description: 保存后会提交到 GitHub，Cloudflare Pages 自动重建
    folder: src/content/posts
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: md
    format: frontmatter
    sortable_fields: [date, title, updated]
    view_filters:
      - label: 草稿
        field: draft
        pattern: true
      - label: 置顶
        field: pinned
        pattern: true
      - label: 隐藏
        field: private
        pattern: true
    fields:
      - { name: title, label: 标题, widget: string }
      - { name: date, label: 创建时间, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
      - { name: updated, label: 最后修改, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, required: false, hint: "留空就别填 —— 后台清空它会写成空字符串（schema 已容错）" }
      - name: category
        label: 分类
        widget: select
        options: [日记, 技术, 随笔]
        default: 随笔
        hint: "选「日记」会自动隐藏：不进首页/标签/搜索/RSS/sitemap，但链接仍可访问"
      - { name: tags, label: 标签, widget: list, default: [], hint: "回车添加一个标签" }
      - { name: summary, label: 摘要, widget: text, required: false, hint: "留空则自动截取正文开头" }
      - { name: cover, label: 封面图, widget: image, required: false, choose_url: true, hint: "留空则使用 CSS 渐变封面" }
      - name: coverStyle
        label: 封面样式
        widget: select
        required: false
        hint: "留空则按分类自动挑选"
        options:
          - { label: "潮汐 wave", value: wave }
          - { label: "星云 nebula", value: nebula }
          - { label: "王冠 crown", value: crown }
          - { label: "歌剧院 opera", value: opera }
          - { label: "极光 aurora", value: aurora }
          - { label: "星海 starry", value: starry }
          - { label: "气泡 bubble", value: bubble }
          - { label: "方格 grid", value: grid }
          - { label: "自定义图片 image", value: image }
      - { name: coverHue, label: 封面色相 (0-359), widget: number, required: false, min: 0, max: 359, value_type: int, hint: "202 水蓝 / 38 暖金 / 266 紫罗兰 / 150 薄荷绿" }
      - { name: pinned, label: 置顶, widget: boolean, default: false }
      - { name: draft, label: 草稿, widget: boolean, default: false, hint: "打开后构建时不输出这一篇" }
      - name: private
        label: 隐藏
        widget: boolean
        default: false
        hint: "首页/归档/标签/搜索/RSS/sitemap 里都不出现，但直接开链接仍能看。分类选「日记」会自动隐藏。"
      - { name: body, label: 正文, widget: markdown }
