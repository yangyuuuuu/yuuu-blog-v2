<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>后台自检</title>
    <style>
      body { margin: 0; padding: 18px; font: 14px/1.7 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      table { border-collapse: collapse; margin-top: 10px; }
      th, td { border: 1px solid #ccc; padding: 6px 10px; text-align: left; }
      .ok { color: #0a7; font-weight: 600; }
      .no { color: #c33; font-weight: 600; }
      .sub { color: #667; font-size: 12.5px; }
      pre { background: #f6f8fa; padding: 10px; overflow: auto; }
    </style>
  </head>
  <body>
    <h1 style="font-size:18px;margin:0 0 6px">后台自检</h1>
    <p class="sub">
      对每个版本，各建一个独立 iframe，里面直接放
      <code>&lt;script type="module" src="…"&gt;</code>，5 秒后看 iframe 里有没有长出界面元素。
      不做任何包装 —— 这样才能判断「是版本的问题，还是页面写法的问题」。
    </p>
    <div id="out">检测中…（大概 8 秒）</div>
    <pre id="log"></pre>

    <script>
      var VERSIONS = ['0.212.2', '0.213.2'];
      var rows = [];
      var log = document.getElementById('log');
      var say = function (t) { log.textContent += t + '\n'; };

      function check(ver) {
        return new Promise(function (resolve) {
          var iframe = document.createElement('iframe');
          iframe.style.cssText = 'width:1200px;height:600px;border:1px solid #ddd;background:#fff';
          iframe.srcdoc =
            '<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>t</title></head><body>' +
            '<script type="module" src="https://unpkg.com/@sveltia/cms@' + ver + '/dist/sveltia-cms.mjs"><\/script>' +
            '</body></html>';
          document.body.appendChild(iframe);
          var done = false;
          var finish = function () {
            if (done) return;
            done = true;
            var doc = null;
            try { doc = iframe.contentDocument; } catch (e) { say(ver + ': 取不到 iframe 文档 ' + e.message); }
            var r = { ver: ver, boot: false, ui: 0, text: '' };
            if (doc) {
              r.boot = doc.documentElement.hasAttribute('data-auto-theming');
              var els = doc.body.querySelectorAll('[class]');
              var n = 0;
              for (var i = 0; i < els.length; i++) {
                if (/svelte-|sveltiacms/.test(els[i].className || '')) n++;
              }
              r.ui = n;
              r.text = (doc.body.innerText || '').replace(/\s+/g, ' ').slice(0, 60);
            }
            resolve(r);
          };
          setTimeout(finish, 6000);
        });
      }

      (async function () {
        for (var i = 0; i < VERSIONS.length; i++) {
          say('正在测 ' + VERSIONS[i] + ' …');
          rows.push(await check(VERSIONS[i]));
        }
        var html = '<table><tr><th>版本</th><th>Sveltia 启动</th><th>界面元素数</th><th>页面可见文字</th></tr>';
        rows.forEach(function (r) {
          html += '<tr><td>@sveltia/cms@' + r.ver + '</td>' +
            '<td class="' + (r.boot ? 'ok' : 'no') + '">' + (r.boot ? '是' : '否') + '</td>' +
            '<td class="' + (r.ui > 1 ? 'ok' : 'no') + '">' + r.ui + '</td>' +
            '<td>' + (r.text || '(空)') + '</td></tr>';
        });
        html += '</table>';
        html += '<p class="sub" style="margin-top:12px">判读：某一行的「界面元素数 &gt; 1」就是能用；若两行都是 0/1，' +
          '说明是这些 iframe 环境或网络的问题，而不是版本问题。</p>';
        document.getElementById('out').innerHTML = html;
        say('完成');
      })();
    </script>
  </body>
</html>
