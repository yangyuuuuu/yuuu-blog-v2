<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>内容管理 · yuuu</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <style>
      body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    </style>
  </head>
  <body>
    <!--
      Sveltia CMS（Decap / Netlify CMS 的现代替代品，配置格式兼容）。
      配置文件是同目录的 config.yml。

      这就是最开始的写法，请不要再往里加东西。排查记录：
        · 自托管那个 1.9 MB 的 JS    → 弱网/代理链路会截断 → 整页白屏
        · fetch 下来再用 blob 执行    → Sveltia 不挂载界面
        · 加重试包装 / 自己插状态提示  → 同上
      只有下面这三行从建站起一直正常。
      唯一的改动：版本号锁死（原来是不带版本号的 URL，CDN 永远给最新版，
      某天发新版就可能悄悄改坏配置）。

      升级：改下面的版本号，然后打开 /admin 确认能进后台、能发文。
    -->
    <script type="module" src="https://unpkg.com/@sveltia/cms@0.212.2/dist/sveltia-cms.mjs"></script>
  </body>
</html>
