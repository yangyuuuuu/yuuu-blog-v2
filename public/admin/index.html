<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>内容管理 · yuuu</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <style>
      body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      #cmsFallback { max-width: 620px; margin: 80px auto; padding: 0 20px; font-size: 14px; line-height: 1.8; color: #556; }
      #cmsFallback b { color: #223; }
    </style>
  </head>
  <body>
    <!--
      Sveltia CMS（Decap/Netlify CMS 的现代替代品，配置格式兼容）。配置在同目录 config.yml。

      ⚠️ 为什么从 CDN 加载，而不是自托管（别再改回去）：
        自托管 = 浏览器要从本站下一个 1.9 MB 的文件。在「挂代理 / 跨境」的网络上，
        这个大文件经常被中途掐断（实测 curl 报 schannel: server closed abruptly），
        浏览器拿到半截 JS 就解析失败 → 后台整页白屏，而且不给任何提示。
        同一个文件从 unpkg 加载从没出过这个问题（CDN 对大文件分发专门优化过）。
      版本锁死 0.213.2：CDN 上永远拿同一个文件，不会被新版悄悄改坏配置。
      升级：把下面两处版本号一起改，并在浏览器里验一次。
    -->
    <div id="cmsFallback">
      <b>后台正在加载…</b>
      <p>如果这里一直停着不动，说明脚本没能下载下来 —— 多半是网络/代理不稳，刷新一次通常就好。</p>
    </div>

    <script
      type="module"
      src="https://unpkg.com/@sveltia/cms@0.213.2/dist/sveltia-cms.mjs"
      onerror="window.__cmsFallback && window.__cmsFallback()"
    ></script>
    <script>
      /*
       * 兜底：只有主 CDN **明确加载失败**（onerror）时才换 jsDelivr。
       * 不去猜「CMS 有没有启动」—— 它启动要几秒，猜早了会重复注入第二个 CMS。
       */
      window.__cmsFallback = function () {
        if (window.__cmsTried) return;
        window.__cmsTried = true;
        var s = document.createElement('script');
        s.type = 'module';
        s.src = 'https://cdn.jsdelivr.net/npm/@sveltia/cms@0.213.2/dist/sveltia-cms.mjs';
        s.onerror = function () {
          var box = document.getElementById('cmsFallback');
          if (box) box.innerHTML = '<b>后台加载失败。</b><p>两个 CDN 都没连上，检查网络或代理后刷新。</p>';
        };
        document.body.appendChild(s);
      };
    </script>
  </body>
</html>
