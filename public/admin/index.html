<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>内容管理 · yuuu</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <style>
      body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    </style>
  </head>
  <body>
    <!--
      Sveltia CMS（Decap/Netlify CMS 的现代替代品，配置格式兼容）。配置在同目录 config.yml。

      这就是最初能用的写法，别再加东西：
        —— 不要自托管（1.9 MB 大文件在弱网/代理链路上会被截断 → 整页白屏）
        —— 不要 fetch + blob 执行、不要重试包装、不要自己插状态框
           这些「改进」实测会让 Sveltia 不挂载界面（Chrome 145 与无头 Chrome 都不行），
           而最初这个三行写法一直正常。
      唯一保留的改动：版本锁死 —— 原来写的是不带版本号的 URL，
      CDN 上永远给最新版，某天发新版就可能悄悄改坏。
      升级步骤：改下面的版本号，然后在浏览器里打开 /admin 确认能进后台、能发文。
    -->
    <script type="module" src="https://unpkg.com/@sveltia/cms@0.212.2/dist/sveltia-cms.mjs"></script>
  </body>
</html>
