<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>内容管理 · yuuu</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    </style>
  </head>
  <body>
    <!--
      Sveltia CMS：Decap/Netlify CMS 的现代替代品，配置格式兼容。
      想完全自托管（不依赖 CDN）时可以：
        npm i -D @sveltia/cms
        然后把 node_modules/@sveltia/cms/dist/sveltia-cms.js 复制到 public/admin/
        并把下面的 src 换成本地路径 /admin/sveltia-cms.js
    -->
    <script type="module" src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
  </body>
</html>
