<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>内容管理 · yuuu</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <style>
      body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    </style>
  </head>
  <body>
    <!--
      Sveltia CMS（Decap/Netlify CMS 的现代替代品，配置格式兼容）。
      配置在同目录 config.yml。

      JS 是自托管的，不走 CDN —— 后台不依赖任何外部站点，unpkg 挂了也能发文。
      升级方式（顺便改 public/admin/sveltia-cms.mjs 那个文件）：

        npm i -D --save-exact @sveltia/cms@<新版本>
        Copy-Item node_modules/@sveltia/cms/dist/sveltia-cms.mjs public/admin/ -Force
    -->
    <script type="module" src="/admin/sveltia-cms.mjs"></script>
  </body>
</html>
