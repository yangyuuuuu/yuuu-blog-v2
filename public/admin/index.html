<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>内容管理 · yuuu</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <style>
      body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }

      /*
       * ===== 后台皮肤 =====
       * Decap 的样式是运行时生成的，类名不稳定，所以这里用两招：
       *   1. 覆盖它的主题 CSS 变量（主色 / 文字 / 边框）
       *   2. 对常见标签和 role 属性加 !important 兜底
       * 取色自站点 src/styles/theme.css：水蓝 #7ec8e3 / 金色 #e8c87a /
       * 深色墨蓝 #0d1b2a（本站 --ink 在浅色底上的变体）/ 冷白 #f7fbfe
       */

      :root, body {
        --netlify-cms-primary: #2f7f9e;
        --netlify-cms-primary-hover: #256a85;
        --netlify-cms-primary-active: #1d5570;
        --netlify-cms-secondary: #e8c87a;
        --netlify-cms-text: #1b3346;
        --netlify-cms-text-light: #4a6076;
        --netlify-cms-background: #f7fbfe;
        --netlify-cms-border: #cfe3ee;
        --netlify-cms-border-light: #e6f1f8;
        --netlify-cms-control: #ffffff;
        --netlify-cms-control-hover: #eaf5fb;
        --netlify-cms-focus: #2f7f9e;
        --decap-cms-primary: #2f7f9e;
        --decap-cms-primary-hover: #256a85;
        --decap-cms-text: #1b3346;
        --decap-cms-background: #f7fbfe;
        --decap-cms-border: #cfe3ee;

        /* 中文字体栈：原来那套西文优先的字体，中文会掉到默认字体，显得很糊 */
        --cms-font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei",
          "Hiragino Sans GB", "Source Han Sans SC", "Noto Sans CJK SC", "Segoe UI", sans-serif;
      }

      body, input, textarea, select, button {
        font-family: var(--cms-font-family) !important;
      }
      body { background: #f7fbfe !important; color: #1b3346 !important; }

      /* 主色：链接 / 按钮 / 焦点环 */
      a { color: #2f7f9e; }
      button, [role="button"], input[type="submit"] {
        border-radius: 10px !important;
      }
      button[class*="primary"], [role="button"][class*="primary"] {
        background-color: #2f7f9e !important;
        border-color: #2f7f9e !important;
        color: #fff !important;
      }
      button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
        outline: 2px solid #7ec8e3 !important;
        outline-offset: 1px;
      }
      input, select, textarea {
        border-color: #cfe3ee !important;
        border-radius: 8px !important;
      }
      input:focus, select:focus, textarea:focus {
        border-color: #7ec8e3 !important;
        box-shadow: 0 0 0 3px rgba(126, 200, 227, 0.25) !important;
      }

      /* 顶部 / 侧边栏：浅淡的水蓝底，把主色收一点，不要整片深色 */
      header, nav, [class*="Toolbar"], [class*="Sidebar"] {
        border-color: #e6f1f8 !important;
      }

      /* 登录页 */
      [class*="Login"] [class*="Logo"], [class*="login"] img { max-width: 220px; }

      /*
       * 深色模式：Decap 会跟随系统偏好。上面那套是浅色皮肤，
       * 如果系统是深色，必须换成深色配色，否则深色文字压在浅色底上会糊成一片。
       * 这里用站点自己的深色令牌（--bg #0d1b2a / --ink #e0f0ff）。
       */
      @media (prefers-color-scheme: dark) {
        :root, body {
          --netlify-cms-primary: #7ec8e3;
          --netlify-cms-primary-hover: #9ad6ea;
          --netlify-cms-primary-active: #5fb3d1;
          --netlify-cms-secondary: #e8c87a;
          --netlify-cms-text: #e0f0ff;
          --netlify-cms-text-light: #b3cde3;
          --netlify-cms-background: #0d1b2a;
          --netlify-cms-border: rgba(126, 200, 227, 0.22);
          --netlify-cms-border-light: rgba(126, 200, 227, 0.12);
          --netlify-cms-control: #122436;
          --netlify-cms-control-hover: #17304a;
          --netlify-cms-focus: #7ec8e3;

          --decap-cms-primary: #7ec8e3;
          --decap-cms-text: #e0f0ff;
          --decap-cms-background: #0d1b2a;
          --decap-cms-border: rgba(126, 200, 227, 0.22);
        }
        body { background: #0d1b2a !important; color: #e0f0ff !important; }
        a { color: #7ec8e3; }
        button[class*="primary"], [role="button"][class*="primary"] {
          background-color: #7ec8e3 !important;
          border-color: #7ec8e3 !important;
          color: #0d1b2a !important;
        }
        input, select, textarea {
          background: #122436 !important;
          color: #e0f0ff !important;
          border-color: rgba(126, 200, 227, 0.22) !important;
        }
        header, nav, [class*="Toolbar"], [class*="Sidebar"] {
          border-color: rgba(126, 200, 227, 0.12) !important;
        }
      }

      /*
       * ===== 只做减法：拆掉 Decap 硬编码的桌面最小宽度 =====
       *
       * 背景（390×844 无头 Edge 实测）：AppMainContainer / ToolbarContainer /
       * EditorContainer 上都写着 min-width:800px。手机屏幕没这么宽，于是整页横向溢出
       * （innerWidth 被撑到 800）、右侧一片空白、底部露出没被画到的白条。
       * 这里只把那个最小宽度拆掉，让它按屏幕宽排版。
       *
       * ⚠️⚠️ 别再往这里面加「看起来更合理」的布局覆盖了 —— 踩过的坑：
       *   Decap 的编辑器是 SplitPane，flexDirection:column + 绝对定位 + 百分比高度，
       *   高度靠 100% 一层层算下来。我上一版加了
       *     [class*="SplitPane"] { display: block }
       *     .Pane { height: calc(100dvh - 66px) }
       *   —— 栏位高度直接被钉死、分栏塌掉，手机上进文章只有一片白板（PC 端正常）。
       *   同一版还改了 overflow，滚动链被截断，键盘行为反而更糟。
       *   教训：**布局和高度一概不碰**，只动最小宽度这种「约束」性质的属性。
       */
      html {
        /* 底色画在 body 上、html 透明，露出的是浏览器画布自己的颜色（通常是白的）——
           地址栏收放或键盘弹起时露出来的那一圈就发白。把 html 一起刷成同色。
           这一条只改颜色，不参与布局。 */
        background: #f7fbfe !important;
        -webkit-text-size-adjust: 100%;
      }
      @media (prefers-color-scheme: dark) {
        html { background: #0d1b2a !important; }
      }

      @media (max-width: 759px) {
        [class*="AppMain"],
        [class*="ToolbarContainer"],
        [class*="EditorContainer"] {
          min-width: 0 !important;
          max-width: 100% !important;
        }

        /* 只影响「聚焦时滚到哪里」，不参与布局：让输入框被滚进可视区，
           而不是整页被推走（键盘弹起时指针跑到屏幕外就是这个问题）。 */
        [class*="EditorContainer"] [class*="Pane"],
        [class*="EditorContainer"] [class*="PreviewPaneContainer"],
        textarea,
        [contenteditable="true"] {
          scroll-padding-bottom: 40dvh !important;
        }
        input:focus, textarea:focus { scroll-margin-bottom: 40dvh !important; }

        /* 刘海屏 / 手势条：给顶部工具栏留安全区 */
        [class*="ToolbarContainer"] {
          padding-left: env(safe-area-inset-left);
          padding-right: env(safe-area-inset-right);
        }
      }
    </style>
  </head>
  <body>
    <!--
      Decap CMS（原 Netlify CMS）—— 配置格式与 Sveltia CMS 完全兼容，
      所以同目录的 config.yml 一个字都不用改。

      为什么从 Sveltia 换过来：
        Sveltia 的脚本能下载、能执行（<html> 上会出现它写的 data-* 属性），
        但界面在用户电脑和手机上都不挂载，排查很久没定位到原因。
        Decap 是同类里最成熟的一个，同一环境下本地实测能正常出登录页。

      版本锁在 3.8.4：CDN 上永远拿同一个文件，不会被新版悄悄改坏。
      升级：改下面的版本号，然后打开 /admin 确认能进后台、能发文。
    -->
    <script src="https://unpkg.com/decap-cms@3.8.4/dist/decap-cms.js"></script>

    <!--
      预览面板：让它长得像线上文章页。必须在 decap-cms.js 之后加载
      （registerPreviewStyle / registerPreviewTemplate 都挂在全局 CMS 上）。
    -->
    <script src="/admin/preview.js"></script>
  
    <script>
      /*
       * 保存时自动写「最后修改」= 今天。
       *
       * 用的是 Decap 官方事件（https://decapcms.org/docs/registering-events/）：
       *   CMS.registerEventListener({ name: 'preSave', handler: ({ entry }) =>
       *     entry.get('data').set('updated', 'YYYY-MM-DD') })
       * 只在**点保存**时触发，单纯点进去看不会改任何东西。
       *
       * 写法说明：CMS 是 CDN 上的打包文件，加载完才会挂到 window 上，
       * 所以这里轮询等它就绪再注册，最多等 20 秒。老版本没有 preSave 就退回 postSave
       *（效果一样，只是发生在保存动作之后）。
       */
      (function () {
        var tries = 0;
        var t = setInterval(function () {
          tries++;
          if (!window.CMS || !CMS.registerEventListener) {
            if (tries > 200) clearInterval(t);
            return;
          }
          clearInterval(t);
          var today = function () { return new Date().toISOString().slice(0, 10); };
          var events = (CMS.events && CMS.events.preSave) ? ['preSave'] : ['postSave'];
          events.forEach(function (name) {
            try {
              CMS.registerEventListener({
                name: name,
                handler: function (e) {
                  try { e.entry.get('data').set('updated', today()); } catch (err) { /* 忽略 */ }
                },
              });
            } catch (err) { /* 忽略：注册失败也不影响发文 */ }
          });
        }, 100);
      })();
    </script>
</body>
</html>
