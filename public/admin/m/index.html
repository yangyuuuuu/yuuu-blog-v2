<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!--
      这一页是**专为手机做的写作页**，和 /admin/（Decap）无关。
      viewport 保持最朴素：不加 maximum-scale，不挡用户自己缩放（无障碍要求）。
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f5faff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1b2a" media="(prefers-color-scheme: dark)" />
    <title>写文章 · yuuu</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="stylesheet" href="/admin/m/ui.css" />
  </head>
  <body>
    <!-- ══════════ 登录 ══════════ -->
    <section class="screen screen--login" id="screenLogin">
      <div class="login-card">
        <img class="login-logo" src="/icon-192.png" alt="" width="64" height="64" />
        <h1 class="login-title">写点什么</h1>
        <p class="login-sub">和「私人角落」同一个口令</p>
        <form id="loginForm" autocomplete="on">
          <input
            id="pwd" type="password" name="password" inputmode="text"
            placeholder="口令" autocomplete="current-password" enterkeyhint="go"
            aria-label="口令"
          />
          <button id="loginBtn" class="btn btn--primary" type="submit">进入</button>
        </form>
        <p class="msg" id="loginMsg" role="status"></p>
        <a class="login-alt" href="/admin/p/">全部文章（搜索 / 筛选）→</a>
        <a class="login-alt" href="/admin/g/">图库（管图片分类）→</a>
        <a class="login-alt" href="/admin/">用完整后台（电脑上更合适）→</a>
      </div>
    </section>

    <!-- ══════════ 文章列表 ══════════ -->
    <section class="screen screen--list" id="screenList" hidden>
      <header class="bar">
        <div class="bar-main">
          <h1 class="bar-title">文章</h1>
          <span class="bar-sub" id="listCount"></span>
        </div>
        <button class="icon-btn" id="refreshBtn" type="button" aria-label="刷新">⟳</button>
      </header>

      <div class="search-wrap">
        <input id="search" type="search" placeholder="搜标题 / 分类 / 标签" autocomplete="off" aria-label="搜索文章" />
      </div>

      <div class="filters" id="filters" role="tablist">
        <button class="chip is-on" data-filter="all" role="tab" type="button">全部</button>
        <button class="chip" data-filter="published" role="tab" type="button">已发布</button>
        <button class="chip" data-filter="draft" role="tab" type="button">草稿</button>
        <button class="chip" data-filter="hidden" role="tab" type="button">隐藏</button>
      </div>

      <ul class="list" id="list"></ul>
      <p class="empty" id="listEmpty" hidden>没有匹配的文章</p>
      <div class="list-pad"></div>

      <button class="fab" id="newBtn" type="button" aria-label="写新的">＋</button>
    </section>

    <!-- ══════════ 写作 ══════════ -->
    <section class="screen screen--edit" id="screenEdit" hidden>
      <header class="bar bar--edit">
        <button class="icon-btn icon-btn--back" id="backBtn" type="button" aria-label="返回">←</button>
        <div class="bar-main">
          <span class="bar-sub" id="editState">新文章</span>
        </div>
        <button class="icon-btn" id="moreBtn" type="button" aria-label="更多">⋯</button>
      </header>

      <div class="edit-body">
        <input id="fTitle" class="f-title" type="text" placeholder="标题" autocomplete="off" enterkeyhint="next" />

        <!-- 分类：一行胶囊，比下拉框在手机上好点 -->
        <div class="filters f-cats" id="cats" role="group" aria-label="分类"></div>
        <p class="f-hint" id="catHint"></p>

        <div class="f-tags-row" id="tagRow"></div>

        <textarea
          id="fBody" class="f-body"
          placeholder="正文，支持 Markdown…"
          spellcheck="false" autocapitalize="sentences"
        ></textarea>
        <p class="f-hint f-hint--breaks" id="breakHint"></p>

        <details class="more" id="morePanel">
          <summary>更多设置</summary>
          <div class="more-inner">
            <label class="field">
              <span class="field-label">摘要</span>
              <textarea id="fSummary" rows="2" placeholder="留空则自动截取正文开头"></textarea>
            </label>
            <label class="field">
              <span class="field-label">标签</span>
              <input id="fTags" type="text" placeholder="逗号分隔，例如：随笔, 手机" autocomplete="off" />
            </label>
            <label class="field">
              <span class="field-label">创建时间</span>
              <input id="fDate" type="date" />
            </label>
            <div class="switches">
              <label class="switch">
                <input id="fBreaks" type="checkbox" />
                <span>回车即换行<em>按回车就是真的换行；关掉则按标准 Markdown（空一行才换段）</em></span>
              </label>
              <label class="switch">
                <input id="fDraft" type="checkbox" />
                <span>草稿<em>存起来但不发布</em></span>
              </label>
              <label class="switch">
                <input id="fPrivate" type="checkbox" />
                <span>隐藏<em>不进首页/搜索/RSS</em></span>
              </label>
            </div>
          </div>
        </details>

        <div class="edit-pad"></div>
      </div>

      <footer class="savebar">
        <span class="savebar-msg" id="saveMsg"></span>
        <span class="savebar-count" id="wordCount"></span>
        <button class="btn btn--primary" id="saveBtn" type="button">保存</button>
      </footer>

      <!-- 只在有未保存改动时浮出，平时保持界面安静 -->
      <button class="save-fab" id="saveFab" type="button" hidden>保存</button>

      <div class="sheet" id="sheet" hidden>
        <div class="sheet-panel">
          <button class="sheet-item" id="viewBtn" type="button">查看文章页</button>
          <button class="sheet-item sheet-item--danger" id="delBtn" type="button">删除这篇</button>
          <button class="sheet-item" id="cancelSheet" type="button">取消</button>
        </div>
      </div>
    </section>

    <!-- 保存成功的浮层提示 -->
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <!--
      登录表单的「原生提交」守卫。
      ⚠️ 为什么需要它：ui.js 是 module（延迟执行），加载完成前表单还没有监听器。
      用户如果这时输了口令按回车，浏览器会**原生提交**（GET 带上 ?password=…）→ 页面刷新
      → 又看到登录页 —— 表现成"验证后重复返回登录页"。手机上网络慢时特别容易撞上。
      这里用一个内联脚本（立即执行）先把默认行为拦掉，等模块加载好再接真正的逻辑。
    -->
    <script>
      (function () {
        var f = document.getElementById('loginForm');
        if (f) f.addEventListener('submit', function (e) { e.preventDefault(); });
      })();
    </script>
    <script type="module" src="/admin/m/ui.js"></script>
  </body>
</html>
