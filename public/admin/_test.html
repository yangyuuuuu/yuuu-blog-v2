<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>后台选型测试</title>
    <style>
      body { margin: 0; padding: 16px; font: 14px/1.7 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      table { border-collapse: collapse; margin-top: 8px; }
      th, td { border: 1px solid #bbb; padding: 6px 10px; text-align: left; }
      .ok { color: #0a7; font-weight: 700; }
      .no { color: #c33; font-weight: 700; }
      iframe { width: 100%; height: 520px; border: 1px solid #ddd; background: #fff; margin-top: 10px; }
    </style>
  </head>
  <body>
    <h1 style="font-size:17px;margin:0 0 4px">后台选型测试</h1>
    <p id="hint" style="color:#556">检测中…（约 10 秒）</p>
    <div id="table"></div>
    <p style="color:#556;font-size:12.5px">
      判读：<b>哪个的「界面元素」不是 0</b>，就用哪个当后台。
      两个都是 0 的话，说明是浏览器环境的问题，得换思路（比如不用网页后台）。
    </p>
    <div id="frames"></div>

    <script>
      var CANDIDATES = [
        { name: 'Sveltia CMS 0.212.2', url: 'https://unpkg.com/@sveltia/cms@0.212.2/dist/sveltia-cms.mjs', type: 'module' },
        { name: 'Sveltia CMS 0.210.0', url: 'https://unpkg.com/@sveltia/cms@0.210.0/dist/sveltia-cms.mjs', type: 'module' },
        { name: 'Decap CMS 3.8.4', url: 'https://unpkg.com/decap-cms@3.8.4/dist/decap-cms.js', type: 'classic' },
      ];
      var log = [];

      function measure(doc) {
        var out = { boot: false, ui: 0, text: '', err: '' };
        try {
          out.boot = !!doc.documentElement.getAttribute('data-auto-theming');
          var all = doc.body.querySelectorAll('*');
          var n = 0;
          for (var i = 0; i < all.length; i++) {
            var c = all[i].getAttribute && all[i].getAttribute('class');
            if (c && /svelte-|sveltiacms|css-|nc-|Netlify/.test(c)) n++;
          }
          out.ui = n;
          out.text = (doc.body.innerText || '').replace(/\s+/g, ' ').trim().slice(0, 50);
        } catch (e) { out.err = e.message; }
        return out;
      }

      CANDIDATES.forEach(function (c, i) {
        var f = document.createElement('iframe');
        f.id = 'f' + i;
        var tag = c.type === 'module'
          ? '<script type="module" src="' + c.url + '"><\/script>'
          : '<script src="' + c.url + '"><\/script>';
        f.srcdoc = '<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>' + c.name +
          '</title><style>body{margin:0;font-family:-apple-system,"Microsoft YaHei",sans-serif}</style></head><body>' +
          tag + '</body></html>';
        f.onload = function () {
          setTimeout(function () {
            var r = measure(f.contentDocument);
            log.push({ name: c.name, r: r });
            render();
          }, 7000);
        };
        document.getElementById('frames').appendChild(f);
      });

      function render() {
        if (log.length !== CANDIDATES.length) return;
        var h = '<table><tr><th>方案</th><th>Sveltia 启动标记</th><th>界面元素数</th><th>可见文字</th></tr>';
        log.forEach(function (x) {
          h += '<tr><td>' + x.name + '</td>' +
            '<td class="' + (x.r.boot ? 'ok' : 'no') + '">' + (x.r.boot ? '是' : '否') + '</td>' +
            '<td class="' + (x.r.ui > 1 ? 'ok' : 'no') + '">' + x.r.ui + '</td>' +
            '<td>' + (x.r.text || '(空)') + (x.r.err ? ' [' + x.r.err + ']' : '') + '</td></tr>';
        });
        h += '</table>';
        document.getElementById('table').innerHTML = h;
        document.getElementById('hint').textContent = '完成 —— 看哪一行的「界面元素数」大于 0';
      }
    </script>
  </body>
</html>
