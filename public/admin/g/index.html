<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f5faff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1b2a" media="(prefers-color-scheme: dark)" />
    <title>图库 · yuuu</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="stylesheet" href="/admin/g/ui.css" />
  </head>
  <body>
    <!-- ══════════ 登录（和写作页、私人角落同一个口令）══════════ -->
    <section class="screen screen--login" id="screenLogin">
      <div class="login-card">
        <img class="login-logo" src="/icon-192.png" alt="" width="64" height="64" />
        <h1 class="login-title">图库</h1>
        <p class="login-sub">和「私人角落」同一个口令</p>
        <form id="loginForm">
          <input id="pwd" type="password" placeholder="口令" autocomplete="current-password" enterkeyhint="go" aria-label="口令" />
          <button id="loginBtn" class="btn btn--primary" type="submit">进入</button>
        </form>
        <p class="msg" id="loginMsg" role="status"></p>
        <a class="login-alt" href="/admin/p/">全部文章 →</a>
        <a class="login-alt" href="/admin/m/">去写文章 →</a>
        <a class="login-alt" href="/admin/map/">全部页面索引 →</a>
      </div>
    </section>

    <!-- ══════════ 图库 ══════════ -->
    <section class="screen" id="screenGallery" hidden>
      <header class="bar">
        <div class="bar-main">
          <h1 class="bar-title">图库</h1>
          <span class="bar-sub" id="count"></span>
        </div>
        <button class="icon-btn" id="selectBtn" type="button" aria-label="批量选择">☑</button>
        <button class="icon-btn" id="refreshBtn" type="button" aria-label="刷新">⟳</button>
      </header>

      <!-- 出错时在这里说明原因（图库会同时刷新列表，不会让人以为图丢了） -->
      <div class="banner" id="banner" hidden>
        <span id="bannerText"></span>
        <button class="link-btn" id="bannerAction" type="button" hidden></button>
      </div>

      <div class="filters" id="cats" role="tablist"></div>

      <div class="search-wrap">
        <input id="search" type="search" placeholder="搜文件名 / 分类" autocomplete="off" aria-label="搜索图片" />
      </div>

      <div class="grid" id="grid"></div>
      <p class="empty" id="empty" hidden>这里还没有图片</p>
      <div class="grid-pad"></div>

      <!-- 批量操作条：进入选择模式后出现在底部 -->
      <div class="batchbar" id="batchbar" hidden>
        <div class="batch-info">
          <b id="batchCount">0</b> 张已选
          <button class="link-btn" id="selectAllBtn" type="button">全选</button>
          <button class="link-btn" id="clearSelBtn" type="button">清空</button>
        </div>
        <div class="batch-actions">
          <button class="btn btn--ghost" id="batchMoveBtn" type="button">改分类</button>
          <button class="btn btn--danger" id="batchDelBtn" type="button">删除</button>
          <button class="btn btn--primary" id="batchDoneBtn" type="button">完成</button>
        </div>
      </div>

      <!--
        待提交队列条：改名 / 改分类 / 删除先在本地攒着，点这里一次提交。
        好处是「改十张只等一次」，而不是改一次等一次 GitHub。
      -->
      <div class="queuebar" id="queueBar" hidden>
        <div class="queue-info">
          <b id="queueCount">0</b> 项待提交
          <span class="queue-hint">改完一起提交，只等一次</span>
        </div>
        <div class="queue-actions">
          <button class="btn btn--ghost" id="queueUndoBtn" type="button">全部撤销</button>
          <button class="btn btn--primary" id="queueCommitBtn" type="button">提交</button>
        </div>
      </div>

      <!-- 上传：右下角悬浮。选了图之后会先问归到哪个分类 -->
      <button class="fab" id="pickBtn" type="button" aria-label="上传图片">＋</button>
      <input id="fileInput" type="file" accept="image/*" multiple hidden />
    </section>

    <!-- ══════════ 图片操作面板 ══════════ -->
    <div class="sheet" id="sheet" hidden>
      <div class="sheet-panel">
        <div class="sheet-head">
          <img class="sheet-thumb" id="sheetThumb" alt="" />
          <div class="sheet-meta">
            <b id="sheetName"></b>
            <span id="sheetInfo"></span>
          </div>
        </div>
        <div class="sheet-body" id="sheetBody"></div>
      </div>
    </div>

    <!-- 上传时选分类 -->
    <div class="sheet" id="dirSheet" hidden>
      <div class="sheet-panel">
        <p class="sheet-title">这些图归到哪个分类？</p>
        <div class="filters filters--wrap" id="dirChoices"></div>
        <div class="dir-new">
          <input id="newDir" type="text" placeholder="新建分类…" autocomplete="off" maxlength="20" />
          <button class="btn btn--ghost" id="useNewDir" type="button">用这个</button>
        </div>
        <button class="btn btn--primary" id="cancelDir" type="button">取消</button>
      </div>
    </div>

    <!-- ══════════ 重命名 ══════════ -->
    <div class="sheet" id="renameSheet" hidden>
      <div class="sheet-panel">
        <p class="sheet-title">重命名图片</p>
        <p class="sheet-hint" id="renameHint"></p>
        <input id="renameInput" type="text" placeholder="新文件名，例如 芙芙-头像" autocomplete="off" maxlength="60" />
        <p class="sheet-hint">
          改名会推迟到「提交」时一起做，并且**总会**把文章里的引用一起改掉 ——
          否则已经引用这张图的文章会变成破图。
        </p>
        <div class="sheet-actions">
          <button class="btn btn--ghost" id="renameCancel" type="button">取消</button>
          <button class="btn btn--primary" id="renameOk" type="button">改名</button>
        </div>
      </div>
    </div>

    <!-- ══════════ 看原图（灯箱）══════════ -->
    <div class="lightbox" id="lightbox" hidden>
      <img id="lightboxImg" alt="" />
      <div class="lightbox-bar">
        <span id="lightboxInfo"></span>
        <button class="btn btn--ghost" id="lightboxRaw" type="button">在新标签打开</button>
        <button class="btn btn--primary" id="lightboxClose" type="button">关闭</button>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <!--
      登录表单的「原生提交」守卫。
      ⚠️ 为什么需要它：ui.js 是 module（延迟执行），加载完成前表单还没有监听器。
      用户如果这时输了口令按回车，浏览器会**原生提交**（GET 带上 ?password=…）→ 页面刷新
      → 又看到登录页 —— 表现成"验证后重复返回登录页"。手机上网络慢时特别容易撞上。
      这里用一个内联脚本（立即执行）先把默认行为拦掉，等模块加载好再接真正的逻辑。
    -->
    <script>
      (function () {
        var f = document.getElementById('loginForm');
        if (f) f.addEventListener('submit', function (e) { e.preventDefault(); });
      })();
    </script>
    <script type="module" src="/admin/g/ui.js"></script>
  </body>
</html>
