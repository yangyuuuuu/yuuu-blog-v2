name = "yuuu-oauth"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# 自定义域：部署后 Worker 就挂在 https://oauth.yuuu.love
# （DNS 记录由 Cloudflare 自动创建，不需要手动加）
routes = [
  { pattern = "oauth.yuuu.love", custom_domain = true }
]

[vars]
# 只允许博客自己的页面来调这个 Worker
ALLOWED_ORIGIN = "https://yuuu.love"

# 密钥不要写在这里，用命令写入：
#   wrangler secret put GITHUB_CLIENT_ID
#   wrangler secret put GITHUB_CLIENT_SECRET
